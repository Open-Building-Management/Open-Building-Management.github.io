name: Build CodeMirror bundle

on:
  workflow_dispatch:
    inputs:
      codemirror_version:
        description: "Version of codemirror"
        required: true
        type: string
        default: "6.0.2"
      base:
        description: "CodeMirror base packages as package:version pairs, comma-separated"
        required: true
        type: string
        default: "autocomplete:6.0.0,language:6.0.0"
      lang_yaml_version:
        description: "Version of @codemirror/lang-yaml"
        required: true
        type: string
        default: "6.1.3"
      esbuild_version:
        description: "Version of esbuild (build tool)"
        required: true
        type: string
        default: "0.25.11"
      produce_pr_to_bump_lib:
        description: "Produce a PR to update vendor/codemirror and geometry-editor.js"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Bundle CodeMirror and utilities (such as YAML language support)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        working-directory: build/codemirror

    env:
      CODEMIRROR_VERSION: ${{ inputs.codemirror_version }}
      BASE_PACKAGES: ${{ inputs.base }}
      BASE_SCOPE: "@codemirror"
      LANG_YAML_VERSION: ${{ inputs.lang_yaml_version }}
      ESBUILD_VERSION: ${{ inputs.esbuild_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate CodeMirror entry point
        run: python3 scripts/generate_entry.py "${BASE_PACKAGES}"

      - name: Install selected dependencies
        shell: bash
        run: |
          BASE_INSTALL_ARGS=()
          IFS=',' read -r -a BASE_SPECS <<< "${BASE_PACKAGES}"

          for spec in "${BASE_SPECS[@]}"; do
            package="${spec%%:*}"
            version="${spec#*:}"

            if [[ "${spec}" != *:* || ! "${package}" =~ ^[a-z0-9-]+$ || -z "${version}" ]]; then
              echo "::error::Invalid base package specification: ${spec}"
              echo "Expected comma-separated package:version pairs (without the @codemirror scope)."
              exit 1
            fi

            BASE_INSTALL_ARGS+=("${BASE_SCOPE}/${package}@${version}")
          done

          if [[ ${#BASE_INSTALL_ARGS[@]} -eq 0 ]]; then
            echo "::error::The base input must contain at least one package."
            exit 1
          fi

          npm install --no-save --no-package-lock --no-audit --no-fund \
            "codemirror@${CODEMIRROR_VERSION}" \
            "${BASE_INSTALL_ARGS[@]}" \
            "@codemirror/lang-yaml@${LANG_YAML_VERSION}" \
            "esbuild@${ESBUILD_VERSION}"

      - id: js
        name: Set js name
        run: |
          t0="cm-${CODEMIRROR_VERSION}"
          t1="-yaml-${LANG_YAML_VERSION}"
          base_tag="$(printf '%s' "${BASE_PACKAGES}" | sed -E 's/:/-/g; s/,/_/g')"
          echo "name=${t0}${t1}-${base_tag}" >> "$GITHUB_OUTPUT"

      - name: Build ES module bundle
        run: |
          OUTPUT="dist/${{ steps.js.outputs.name }}.js"
          mkdir -p dist
          ./node_modules/.bin/esbuild src/index.js \
            --bundle \
            --format=esm \
            --target=es2022 \
            --outfile="${OUTPUT}"
          echo "BUNDLE_FILE=${OUTPUT}" >> "$GITHUB_ENV"

      - name: Check bundle
        run: |
          test -s "${BUNDLE_FILE}"
          if grep -Eq 'from ["'\''/](@codemirror|codemirror)|import\(["'\''/](@codemirror|codemirror)' "${BUNDLE_FILE}"; then
            echo "::error::The bundle still contains an external CodeMirror import."
            exit 1
          fi
          echo "Bundle size: $(wc -c < "${BUNDLE_FILE}") bytes"

      - name: Upload CodeMirror bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.js.outputs.name }}-esbuild${{ inputs.esbuild_version }}
          path: build/codemirror/dist/${{ steps.js.outputs.name }}.js
          if-no-files-found: error
          retention-days: 30

      - name: Prepare vendor bundle and update component import
        if: ${{ inputs.produce_pr_to_bump_lib }}
        working-directory: .
        env:
          BUNDLE_NAME: ${{ steps.js.outputs.name }}
        run: |
          set -euo pipefail

          branch="automation/bump-codemirror-${BUNDLE_NAME}"
          git fetch origin main
          git switch --force-create "${branch}" origin/main

          source="build/codemirror/dist/${BUNDLE_NAME}.js"
          target="vendor/codemirror/${BUNDLE_NAME}.js"

          test -s "${source}"
          mkdir -p vendor/codemirror
          cp "${source}" "${target}"

          python3 build/codemirror/scripts/update_component_import.py "${BUNDLE_NAME}"


      - name: Create or update CodeMirror bump pull request
        if: ${{ inputs.produce_pr_to_bump_lib }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_NAME: ${{ steps.js.outputs.name }}
        run: |
          set -euo pipefail

          branch="automation/bump-codemirror-${BUNDLE_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "vendor/codemirror/${BUNDLE_NAME}.js" \
            "lib/modules/components/geometry-editor.js"

          if git diff --cached --quiet; then
            echo "::notice::The selected CodeMirror bundle is already present on main; no bump PR is needed."
            exit 0
          fi

          git commit -m "Bump CodeMirror bundle to ${BUNDLE_NAME}"
          git push --force origin "${branch}"

          if gh pr view "${branch}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Updated existing pull request for ${branch}."
          else
            cat > "${RUNNER_TEMP}/pr-body.md" <<'EOF'
          ## Summary

          - Add the generated CodeMirror bundle to `vendor/codemirror/`.
          - Update the bundle import in `geometry-editor.js`.

          Generated by the **Build CodeMirror bundle** workflow. This pull request is intentionally left open for manual review and merging.
          EOF

            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${branch}" \
              --title "Bump CodeMirror bundle (${BUNDLE_NAME})" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
