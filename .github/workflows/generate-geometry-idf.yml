name: Generate geometry IDF

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ladybug_codes GHCR image tag"
        required: true
        default: "ep24.1.0-9d7789a3ac_idfhub0.0.4"
        type: string
      geometry_yaml:
        description: "Geometry configuration (YAML)"
        required: true
        type: string
        default: |
          name: example

          blocks:
            ss1_alt: &ss1_alt -4
            rdc_alt: &rdc_alt 0
            d0: 19
            d3: 4
            d4: 4
            d5: 3
            d8: 2.8
            d9: 3
            d10: 1.6
            d11: 3.8
            d911: d9+d10+d11
            ss1_floor:
              - [d0, 0, *ss1_alt]
              - [d0, d3+d4+d5, *ss1_alt]
              - [0, d3+d4+d5, *ss1_alt]
              - [0, 0, *ss1_alt]
            ss1_roof:
              - [d0, d3+d4, *rdc_alt]
              - [d0, d3+d4+d5, *rdc_alt]
              - [0, d3+d4+d5, *rdc_alt]
              - [0, d3+d4, *rdc_alt]
            rdc_cage:
              - [d9+d10, 0, *rdc_alt]
              - [d9+d10, d8, *rdc_alt, air_boundary]
              - [d911, d8, *rdc_alt]
              - [d911, 0, *rdc_alt]
            caves:
              - [0, 0, *rdc_alt]
              - rdc_cage
              - ["d0", 0, *rdc_alt]
              - ["d0", "d3+d4", *rdc_alt]
              - [0, "d3+d4", *rdc_alt]

          immeuble:
            ss1:
              height: 4
              use_blocks_vars: 1
              constructions:
                default: townhouse_basement
                exclude:
                  roofs: [2]
              floors: [ss1_floor]
              roofs: [ss1_roof, caves, rdc_cage]
              walls: [ss1_floor]
            rdc:
              height: 3
              use_blocks_vars: 1
              constructions:
                floors: townhouse_basement
              walls: [caves]
              apertures:
                5: [2, 1.4, 1.5, 1]
              doors:
                6: [1, 2, 3, 0]
            rdc_cage:
              height: 3
              use_blocks_vars: 1
              walls: [rdc_cage]

permissions:
  packages: read

jobs:
  generate:
    name: Generate geometry IDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate and write geometry YAML
        id: geometry
        env:
          GEOMETRY_YAML: ${{ inputs.geometry_yaml }}
        run: |
          if [[ -z "${GEOMETRY_YAML//[[:space:]]/}" ]]; then
            echo "::error::The geometry YAML input is empty."
            exit 1
          fi
          if (( ${#GEOMETRY_YAML} > 60000 )); then
            echo "::error::The geometry YAML input exceeds 60,000 characters."
            exit 1
          fi
          printf '%s\n' "$GEOMETRY_YAML" > geometry.yml
          echo "Geometry YAML written to $GITHUB_WORKSPACE/geometry.yml"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull geometry generator image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="ghcr.io/open-building-management/ladybug_codes:$IMAGE_TAG"
          docker pull "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Generate geometry IDF
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$IMAGE" \
            python3 -m generate_geometry_from_yaml \
              --conf=/opt/ladybug_codes/configuration.yml \
              --geoconf=/workspace/geometry.yml

      - name: Check generated IDF
        id: output
        run: |
          idf_file="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.idf' -print -quit)"
          if [[ -z "$idf_file" || ! -s "$idf_file" ]]; then
            echo "::error::The geometry generator did not produce a non-empty IDF file."
            exit 1
          fi
          echo "idf_path=$idf_file" >> "$GITHUB_OUTPUT"
          echo "Generated $(wc -c < "$idf_file") bytes in $(basename "$idf_file")"

      - name: Upload generated IDF
        uses: actions/upload-artifact@v4
        with:
          name: geometry-idf-${{ github.run_id }}
          path: ${{ steps.output.outputs.idf_path }}
          if-no-files-found: error
          retention-days: 30
