    <script type="module" src="/lib/modules/components/obm-collada-scene-editor.js"></script>
  </head>
<body>
  {% include menu.html %}
  <style>
    .scene-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

    }
    .scene-workspace > * {
      min-width: 0;
    }

      .scene-workspace {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
  <main class="container-fluid">
    <div class="row">
      <div class="col">
        <h1 class="display-5" data-i18n="gallery.build">
          Organisez votre système énergétique
        </h1>
      </div>
    </div>
    <div class="row">
      <div class="col">
        {{ content }}
      </div>
    </div>
  </main>
  <obm-site-footer></obm-site-footer>
</body>
</html>
