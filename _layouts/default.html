<!DOCTYPE html>
  <head>
    {% include three-imports.html %}
    {% include head.html %}
  </head>
<body>
  <obm-site-nav></obm-site-nav>
  <main class="container-fluid">
    <div class="row">
      <h1 class="display-5" data-i18n="home.master">
        Maitrisez le fonctionnement de votre bâtiment à travers un jumeau numérique
      </h1>
    </div>
    <div class="row">
      <div class="col">
        <idf-viewer id="building" src="/models/example.idf" style="height: 500px"></idf-viewer>
      </div>
      <div class="col-sm">
        <idf-legend viewer="building"></idf-legend>
      </div>
    </div>
  </main>
  </script>
  <script type="module" src="/lib/modules/components/idf-viewer.js"></script>
  <script type="module" src="/lib/modules/components/idf-legend.js"></script>
  <script>
    const models = [
      'bardoux.idf',
      'agence_acf.idf',
    ];
    const viewer = document.querySelector('idf-viewer');
    const model = models[Math.floor(Math.random() * models.length)];
    viewer.setAttribute('src', `/models/${model}`);
  </script>
  <obm-site-footer></obm-site-footer>
</body>
</html>
